server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for high-speed delivery to mobile devices
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Cache static assets (CSS, JS, Fonts, Images)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
    }

    # Video streaming optimization for introduction_video.mp4
    location /videos/ {
        mp4;
        mp4_buffer_size 1m;
        mp4_max_buffer_size 10m;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Single Page Application (SPA) fallback to index.html
    # Guarantees /quiz?mode=audience and /confrontation work without 404 on refresh
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Custom security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
